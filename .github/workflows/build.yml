name: Bygg APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "server/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Packa upp signeringsnyckeln
        env:
          JPFM_SIGNING_PASSWORD: ${{ secrets.JPFM_SIGNING_PASSWORD }}
        run: |
          if [ -z "$JPFM_SIGNING_PASSWORD" ]; then
            echo "::warning::Hemligheten JPFM_SIGNING_PASSWORD saknas – bygget signeras med debug-nyckeln och publiceras inte."
            exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in app/jpfm.keystore.enc -out "$RUNNER_TEMP/jpfm.keystore" \
            -pass env:JPFM_SIGNING_PASSWORD
          echo "JPFM_KEYSTORE=$RUNNER_TEMP/jpfm.keystore" >> "$GITHUB_ENV"

      - name: Testa och bygg
        env:
          JPFM_SIGNING_PASSWORD: ${{ secrets.JPFM_SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Kompilerings- och testfel som anteckningar, så att de syns direkt på bygget (och kan läsas via API:t).
      - name: Visa fel
        if: failure()
        run: |
          log="$RUNNER_TEMP/build.log"
          [ -f "$log" ] || exit 0
          grep -E "^e: |FAILED|What went wrong|ERROR:|Missing class|> .*(Exception|Error|expected)|^\s+(org\.junit|java\.lang|kotlin\.)|^\s+at se\.jpfm" "$log" \
            | head -120 > "$RUNNER_TEMP/errors.txt" || true
          i=0
          while IFS= read -r line; do
            i=$((i+1))
            [ $i -le 48 ] && echo "::error::${line//%/%25}"
          done < "$RUNNER_TEMP/errors.txt"
          exit 0

      - name: Spara byggloggen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

      - name: Döp om APK
        run: cp app/build/outputs/apk/release/app-release.apk jpfm.apk

      - name: Ta bort nyckeln från maskinen
        if: always()
        run: rm -f "$RUNNER_TEMP/jpfm.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: jpfm-apk
          path: jpfm.apk

      # Samma filnamn i varje release, så att länken .../releases/latest/download/jpfm.apk alltid
      # pekar på senaste versionen. Appens uppdaterare letar efter just det namnet.
      - name: Publicera som release
        if: env.JPFM_KEYSTORE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: JPFM 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: jpfm.apk
          body: |
            Bygge ${{ github.run_number }} från ${{ github.sha }}.
            Har du JPFM installerad uppdaterar den sig själv. Annars: se README.

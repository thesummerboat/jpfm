name: JPFM-server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Testa
        working-directory: server
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q tests

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bygg och publicera
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/jpfm-server:latest
            ghcr.io/${{ github.repository_owner }}/jpfm-server:${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Önskningar och godkännanden för JPFM

      - name: Kolla att imagen går att hämta utan inloggning
        run: |
          repo="${{ github.repository_owner }}/jpfm-server"
          token=$(curl -s "https://ghcr.io/token?scope=repository:${repo}:pull" | python3 -c "import sys,json; print(json.load(sys.stdin).get('token',''))" || true)
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json" "https://ghcr.io/v2/${repo}/manifests/latest")
          echo "Anonym hämtning: HTTP ${code}"
          if [ "${code}" != "200" ]; then
            echo "::warning::Imagen jpfm-server är privat. Gör den publik: GitHub → din profil → Packages → jpfm-server → Package settings → Change visibility → Public"
          fi
